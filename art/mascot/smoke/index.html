<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smudge Phaser smoke test</title>
<style>html,body{margin:0;background:#1B2440;color:#E4E8F1;font:14px system-ui}#help{position:fixed;left:12px;top:8px}</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
<div id="help">Arrows walk (8 directions) · Shift runs · Space strikethrough · I inspect · T think · N notes · C celebrate · M melt/reform · 1-6 instrument forms</div>
<script>
const DIRS = { "0,1": "S", "1,1": "SE", "1,0": "E", "1,-1": "NE", "0,-1": "N", "-1,-1": "NW", "-1,0": "W", "-1,1": "SW" };
const FORMS = ["ruler", "beaker", "stopwatch", "protractor", "lens", "voltmeter"];

class Smoke extends Phaser.Scene {
  preload() {
    this.load.multiatlas("smudge", "../out/smudge_atlas.json", "../out/");
    this.load.json("smudge_anims", "../out/smudge_anims.json");
  }
  create() {
    this.anims.fromJSON(this.cache.json.get("smudge_anims"));
    this.add.rectangle(480, 470, 960, 140, 0x3e2614);
    this.smudge = this.add.sprite(480, 400, "smudge").setScale(4).setOrigin(0.5, 0.94);
    this.dir = "S"; this.busy = null; this.melted = false;
    this.keys = this.input.keyboard.createCursorKeys();
    this.input.keyboard.on("keydown", e => this.onKey(e));
    this.smudge.on("animationcomplete", () => { if (this.busy !== "melt" && this.busy !== "form") this.busy = null; });
    this.smudge.play("idle_S");
  }
  once(name) { this.busy = name; this.smudge.play(`${name}_${this.dir}`); }
  onKey(e) {
    const k = e.key.toLowerCase();
    if (k === " ") this.once("strikethrough");
    if (k === "i") this.once("inspect");
    if (k === "t") this.once("think");
    if (k === "n") this.once("write_notes");
    if (k === "c") this.once("celebrate");
    if (k === "m") {
      if (this.melted) { this.melted = false; this.once("shapeshift_reform"); }
      else { this.melted = true; this.busy = "melt"; this.smudge.play(`shapeshift_melt_${this.dir}`); }
    }
    const n = parseInt(k, 10);
    if (n >= 1 && n <= 6) { this.busy = "form"; this.smudge.play(`form_${FORMS[n - 1]}_in_${this.dir}`).chain(`form_${FORMS[n - 1]}_${this.dir}`); }
  }
  update(_, dt) {
    const k = this.keys;
    const dx = (k.right.isDown ? 1 : 0) - (k.left.isDown ? 1 : 0);
    const dy = (k.down.isDown ? 1 : 0) - (k.up.isDown ? 1 : 0);
    if (dx || dy) {
      this.dir = DIRS[`${dx},${dy}`];
      const run = k.shift.isDown;
      const speed = (run ? 0.18 : 0.09) * dt;
      const len = Math.hypot(dx, dy);
      this.smudge.x = Phaser.Math.Clamp(this.smudge.x + dx / len * speed, 40, 920);
      this.smudge.y = Phaser.Math.Clamp(this.smudge.y + dy / len * speed * 0.6, 330, 520);
      this.busy = null; this.melted = false;
      this.smudge.play(`${run ? "run" : "walk"}_${this.dir}`, true);
    } else if (!this.busy && !this.melted) {
      this.smudge.play(`idle_${this.dir}`, true);
    }
    this.smudge.setDepth(this.smudge.y);
  }
}

window.game = new Phaser.Game({ type: Phaser.AUTO, width: 960, height: 540, pixelArt: true, backgroundColor: "#1B2440", scene: Smoke });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05060F">
  <title>Smudge and the Case of the Missing Laws</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Lilita+One&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #05060F; overflow: hidden; touch-action: none; }
    #game { position: fixed; inset: 0; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* Pixelify's 5 reads as 9: digits come from Silkscreen (but its wide 1 splits "10"), letters stay Pixelify */
    @font-face { font-family: "Smudge Digits"; font-display: swap; unicode-range: U+0030, U+0032-0039;
      src: url(https://fonts.gstatic.com/s/silkscreen/v6/m8JXjfVPf62XiF7kO-i9YLNlaw.woff2) format("woff2"); }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
